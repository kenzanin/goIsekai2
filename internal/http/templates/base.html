{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Active.Title}} — goisekai2</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; color: #222; }
    nav ul { display: flex; gap: 1rem; list-style: none; padding: 0; }
    nav a[aria-current="page"] { font-weight: 700; text-decoration: underline; }
    .row { display: grid; grid-template-columns: 18rem 1fr auto; gap: .5rem; align-items: center; margin: .35rem 0; }
    .row label { font-size: .9rem; }
    .source, .badge, .error { font-size: .8rem; margin-left: .4rem; }
    .badge { border: 1px solid #a60; border-radius: .3rem; padding: .1rem .3rem; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <nav aria-label="Main">
    <ul>
      {{range .Pages}}<li><a href="{{.Path}}"{{if eq .Path $.Active.Path}} aria-current="page"{{end}}>{{.Title}}</a></li>{{end}}
    </ul>
  </nav>
  <main>{{template "content" .}}</main>
</body>
</html>{{end}}
