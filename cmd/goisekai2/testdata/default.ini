[server]
; TCP listen port
port = 8090
; Outbound HTTP(S) proxy URL
proxy =

[plugin]
; Plugin directory
plugins = data/plugins
; curl-impersonate target; dropdown list from [plugin] fetch_profiles
fetch_profile = chrome116
; HTTP fetch timeout (ms)
fetch_timeout_ms = 30000

[cache]
; Image cache cap (MiB); 2048 MiB = 2 GiB, 4096 MiB = 4 GiB
cache_max_mb = 2048
; Stored image format (webp|avif|jxl|none)
image_format = webp
; Cover longest-side cap (px)
cover_max_px = 800

[updates]
; Days between automatic update batches
update_interval_days = 1
; Maximum auto-updated titles per plugin per batch
update_per_plugin_limit = 5
; Delay between scheduled title requests
update_request_delay_ms = 500
; Hours between database snapshots
backup_interval_h = 24
; Number of database snapshots to retain
backup_keep = 3

[browser]
; Browser health endpoint (CDP /json/version)
url = http://127.0.0.1:9222/json/version
; CDP port for an owned browser child
cdp_port = 9222
; Browser daemon binary to spawn when none is healthy
binary = lightpanda
; Browser call timeout (ms)
timeout_ms = 30000

[paths]
; Data root
data_dir = data
; SQLite library path
library = data/library.db
; Log file path
log_file = data/goisekai.log

[log]
; Log level (trace|debug|info|warning|error)
level = info
